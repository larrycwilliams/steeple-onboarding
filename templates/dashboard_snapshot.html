<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steeple &amp; Stitch — Dashboard</title>
<style>
  /* Self-contained on purpose. This file is opened straight off iCloud on an
     iPad with no server running, so it can reference nothing external. */
  :root{--ink:#14181F;--line:#2C333F;--gold:#C8A253;--paper:#F5F2EC;
        --muted:#8A9099;--bad:#B4443C;--radius:10px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  header{background:var(--ink);color:var(--paper);padding:18px 28px}
  header h1{font-size:17px;margin:0;letter-spacing:.14em;text-transform:uppercase}
  header h1 span{color:var(--gold)}
  header .when{font-size:12px;color:#9AA3B2;margin-top:6px}
  main{max-width:1080px;margin:0 auto;padding:28px}
  h2{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
     margin:34px 0 12px;border-bottom:1px solid #DAD4C8;padding-bottom:8px}
  h2:first-of-type{margin-top:0}
  .card{background:#fff;border:1px solid #E2DDD2;border-radius:var(--radius);
        padding:22px;margin-bottom:18px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
     text-align:left;padding:8px 10px;border-bottom:1px solid #E2DDD2}
  td{padding:11px 10px;border-bottom:1px solid #EFEBE2;vertical-align:top}
  tr:last-child td{border-bottom:0}
  .help{font-size:12px;color:var(--muted)}
  .pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;
        font-weight:700;letter-spacing:.06em;text-transform:uppercase;
        background:#EAE5D9;color:#5C5340}
  .note{font-size:13px;color:#6A5B33;background:#FBF3DF;border-left:3px solid var(--gold);
        padding:11px 14px;border-radius:0 7px 7px 0;margin:14px 0}
  .phone-hide{display:none}
  @media (min-width:700px){ .phone-hide{display:table-cell} }
  @media (max-width:699px){ main{padding:18px 14px} header{padding:14px 16px}
    .card{padding:16px} th,td{padding:10px 6px} }
  .dash-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;
             justify-content:space-between}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
         gap:14px;margin-bottom:20px}
  .tile{background:#fff;border:1px solid #E2DDD2;border-radius:10px;padding:16px 18px}
  .tile-gold{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
  .tile-warn{border-color:#E0C7A0;background:#FDFAF4}
  .tile-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
              color:var(--muted);font-weight:700}
  .tile-value{font-size:26px;font-weight:700;margin:6px 0 2px;letter-spacing:-.02em}
  .tile-note{font-size:12px;color:var(--muted);line-height:1.4}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .row-title{font-weight:700;margin-bottom:6px}
  tr.quiet td{color:var(--muted)}
  tr.current td{background:#FBF3DF}
  .bad{color:var(--bad);font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Steeple <span>&amp;</span> Stitch — Dashboard</h1>
  <div class="when">Snapshot taken {{ taken }} · not live — refresh from the app on the Mac</div>
</header>
<main>
{% include "_dashboard_body.html" %}
</main>
</body>
</html>
